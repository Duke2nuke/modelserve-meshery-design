apiVersion: v1
kind: Namespace
metadata:
  name: modelserve
  labels:
    app.kubernetes.io/part-of: modelserve
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-api
  namespace: modelserve
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-config
  namespace: modelserve
data:
  MODEL_NAME: fraud-detection-v1
  MODEL_VERSION: "1.0.0"
  LOG_LEVEL: info
  WORKERS: "2"
  REQUEST_TIMEOUT_SECONDS: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: modelserve
  labels:
    app.kubernetes.io/name: inference-api
    app.kubernetes.io/part-of: modelserve
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-api
        app.kubernetes.io/part-of: modelserve
    spec:
      serviceAccountName: inference-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Placeholder for the actual inference API image.
          image: ghcr.io/nginxinc/nginx-unprivileged:stable
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: inference-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inference-api
  namespace: modelserve
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inference-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inference-api-pdb
  namespace: modelserve
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-api-hpa
  namespace: modelserve
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inference-api-ingress
  namespace: modelserve
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inference-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inference-api
  namespace: modelserve
spec:
  ingressClassName: nginx
  rules:
    - host: modelserve.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inference-api
                port:
                  number: 80
